name: CarPlay Simulator Snapshot

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Project & Build App
        working-directory: CaraokePOC
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Caraoke.xcodeproj -scheme Caraoke \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Boot Simulator & Capture CarPlay
        working-directory: CaraokePOC
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available | grep -E "iPhone 16|iPhone 15" | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEVICE_UDID" ]; then
            DEVICE_UDID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          echo "Selected Device: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID"
          defaults write com.apple.CoreSimulator.IndigoSimulatorVideo ExternalDisplayType CarPlay
          sleep 5
          APP_PATH=$(find .build/DerivedData -name "Caraoke.app" -type d | head -n 1)
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" app.caraoke.ios "caraoke://ride?demo=true" || true
          sleep 8

          mkdir -p ../screenshots
          xcrun simctl io "$DEVICE_UDID" screenshot ../screenshots/phone_ride_mode.png
          xcrun simctl io "$DEVICE_UDID" screenshot --display=external ../screenshots/carplay_dashboard.png || xcrun simctl io "$DEVICE_UDID" screenshot --display=1 ../screenshots/carplay_dashboard.png || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: carplay-and-phone-snapshots
          path: screenshots/*.png
