name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two macOS jobs. Minutes are budget-conscious (free tier macOS = 10× multiplier):
# each run is a few minutes; well within 200 macOS minutes/month.

jobs:
  core-suite:
    # Full standalone suite: timing, LRC, matcher, policy, throttle,
    # LRCLIB provider (mocked URLProtocol), Spotify PKCE/token/parser,
    # entitlements. No simulator, no signing — pure swiftc.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run standalone suite
        working-directory: CaraokePOC
        run: |
          brew install cmake ninja
          git clone --depth 1 --branch 6.2.2 https://github.com/jpsim/Yams.git /tmp/caraoke-yams
          cmake -S /tmp/caraoke-yams -B /tmp/caraoke-yams-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/caraoke-yams-build
          swiftc -Onone -module-cache-path .build/modulecache \
            -I /tmp/caraoke-yams-build/swift \
            -Xcc -fmodule-map-file=/tmp/caraoke-yams/Sources/CYaml/include/module.modulemap \
            -Xcc -I/tmp/caraoke-yams/Sources/CYaml/include \
            -L /tmp/caraoke-yams-build/lib -lYams \
            Sources/CaraokeCore/*.swift Tests/main.swift -o .build/testrunner
          DYLD_LIBRARY_PATH=/tmp/caraoke-yams-build/lib .build/testrunner

      - name: SwiftUI/ActivityKit/StoreKit layer syntax check
        working-directory: CaraokePOC
        run: |
          FAIL=0
          for f in iOS/*.swift; do
            swiftc -parse "$f" || { echo "PARSE FAIL: $f"; FAIL=1; }
          done
          exit $FAIL

  ios-app-compile:
    # Generates the full Xcode project (app + widget + test targets) with
    # xcodegen, then builds the whole app for the iOS Simulator. This compiles
    # CaraokeCore against the real iOS SDK too (app target includes it) —
    # the first end-to-end compile of the SwiftUI/ActivityKit/StoreKit layer.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: CaraokePOC
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build full app for iOS Simulator (no signing)
        working-directory: CaraokePOC
        run: |
          xcodebuild -project Caraoke.xcodeproj -scheme Caraoke \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  spm-tests:
    # The XCTest target via SwiftPM (mirror of the standalone suite that
    # runs inside Xcode locally).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        working-directory: CaraokePOC
        run: swift test

  testflight:
    # Distribution signing material is supplied by repository secrets.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HAS_ASC_CREDENTIALS == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare App Store Connect API key
        working-directory: CaraokePOC
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect"
          printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > "$HOME/.appstoreconnect/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: CaraokePOC
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install distribution certificate (into searchable keychain)
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          printf '%s' "$DIST_CERT_P12" | base64 -d > /tmp/dist.p12
          # Dedicated keychain (login keychain rejects scripted imports),
          # then make it the DEFAULT keychain so Xcode's automatic signing
          # finds the distribution identity.
          security create-keychain -p caraoke-ci build.keychain
          security unlock-keychain -p caraoke-ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/dist.p12 -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 \
            -k build.keychain
          security list-keychain -d user -s build.keychain login.keychain-db
          security default-keychain -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k caraoke-ci build.keychain >/dev/null
          rm /tmp/dist.p12
          security find-identity -v -p codesigning build.keychain

      - name: Install App Group provisioning profiles
        env:
          PROFILES_B64: ${{ secrets.PROFILES_B64 }}
          ASC_DEVELOPMENT_TEAM: ${{ secrets.ASC_DEVELOPMENT_TEAM }}
        run: |
          python3 - <<'PY'
          import base64, datetime, io, os, pathlib, plistlib, subprocess, tempfile, uuid, zipfile

          profiles = (
              ("Caraoke_TF_Store_Push.mobileprovision", "Caraoke TF Store Push", "app.caraoke.ios"),
              ("Caraoke_Widgets_TF_Store.mobileprovision", "Caraoke Widgets TF Store", "app.caraoke.ios.widgets"),
          )
          destinations = (
              pathlib.Path.home() / "Library/MobileDevice/Provisioning Profiles",
              pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles",
          )
          try:
              value = "".join(os.environ["PROFILES_B64"].split())
              archive = zipfile.ZipFile(io.BytesIO(base64.b64decode(value, validate=True)))
              with archive, tempfile.TemporaryDirectory() as tmp:
                  for filename, name, bundle_id in profiles:
                      data = archive.read(filename)
                      source = pathlib.Path(tmp) / filename
                      source.write_bytes(data)
                      profile = plistlib.loads(subprocess.check_output(["security", "cms", "-D", "-i", str(source)]))
                      entitlements = profile["Entitlements"]
                      valid = (
                          profile["Name"] == name
                          and entitlements["application-identifier"] == os.environ["ASC_DEVELOPMENT_TEAM"] + "." + bundle_id
                          and "group.app.caraoke.ios" in entitlements.get("com.apple.security.application-groups", [])
                          and profile["ExpirationDate"] > datetime.datetime.utcnow()
                          and not entitlements.get("get-task-allow")
                          and "ProvisionedDevices" not in profile
                          and not profile.get("ProvisionsAllDevices")
                          and (bundle_id.endswith(".widgets") or entitlements.get("aps-environment") == "production")
                      )
                      if not valid:
                          raise SystemExit(f"Invalid App Group distribution profile: {name}")
                      for destination in destinations:
                          destination.mkdir(parents=True, exist_ok=True)
                          (destination / (str(uuid.UUID(profile["UUID"])) + ".mobileprovision")).write_bytes(data)
                      print(f"Validated App Group distribution profile: {name}")
          except (KeyError, ValueError, zipfile.BadZipFile):
              raise SystemExit("PROFILES_B64 must contain a base64 ZIP with both App Group distribution profiles.") from None
          PY

      - name: Archive with manual signing
        working-directory: CaraokePOC
        env:
          ASC_DEVELOPMENT_TEAM: ${{ secrets.ASC_DEVELOPMENT_TEAM }}
        run: |
          # Manual signing with the ASC-API-created distribution profiles:
          # "Caraoke TF Store Push" carries aps-environment=production, which
          # is ALL a push-updated Live Activity needs (the old
          # com.apple.developer.usernotifications.live-activities entry was
          # removed - Apple DTS confirmed it is not a real entitlement;
          # ActivityKit push updates require no entitlement, only
          # pushType: .token at request time).
          xcodebuild -project Caraoke.xcodeproj -scheme Caraoke \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Caraoke.xcarchive" \
            DEVELOPMENT_TEAM="$ASC_DEVELOPMENT_TEAM" \
            archive

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caraoke-xcarchive
          path: CaraokePOC/build/Caraoke.xcarchive

      - name: Export + upload to TestFlight (destination=upload)
        working-directory: CaraokePOC
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          ASC_DEVELOPMENT_TEAM: ${{ secrets.ASC_DEVELOPMENT_TEAM }}
        run: |
          # Manual export with the same installed profiles (deterministic;
          # export-time cloud signing fails with "cloud signing permission
          # error" on this account even with an Admin API key).
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$ASC_DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.caraoke.ios</key><string>Caraoke TF Store Push</string>
              <key>app.caraoke.ios.widgets</key><string>Caraoke Widgets TF Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          # Debug: show what the signed archive actually carries
          echo "--- entitlements embedded in signed archive:"
          codesign -d --entitlements :- "$PWD/build/Caraoke.xcarchive/Products/Applications/Caraoke.app" 2>/dev/null || echo "codesign read failed"
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Caraoke.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
