name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two macOS jobs. Minutes are budget-conscious (free tier macOS = 10× multiplier):
# each run is a few minutes; well within 200 macOS minutes/month.

jobs:
  core-suite:
    # Full standalone suite: timing, LRC, matcher, policy, throttle,
    # LRCLIB provider (mocked URLProtocol), Spotify PKCE/token/parser,
    # entitlements. No simulator, no signing — pure swiftc.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run standalone suite
        working-directory: CaraokePOC
        run: |
          swiftc -Onone -module-cache-path .build/modulecache \
            Sources/CaraokeCore/*.swift Tests/main.swift -o .build/testrunner
          .build/testrunner

      - name: SwiftUI/ActivityKit/StoreKit layer syntax check
        working-directory: CaraokePOC
        run: |
          FAIL=0
          for f in iOS/*.swift; do
            swiftc -parse "$f" || { echo "PARSE FAIL: $f"; FAIL=1; }
          done
          exit $FAIL

  ios-app-compile:
    # Generates the full Xcode project (app + widget + test targets) with
    # xcodegen, then builds the whole app for the iOS Simulator. This compiles
    # CaraokeCore against the real iOS SDK too (app target includes it) —
    # the first end-to-end compile of the SwiftUI/ActivityKit/StoreKit layer.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: CaraokePOC
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build full app for iOS Simulator (no signing)
        working-directory: CaraokePOC
        run: |
          xcodebuild -project Caraoke.xcodeproj -scheme Caraoke \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  spm-tests:
    # The XCTest target via SwiftPM (mirror of the standalone suite that
    # runs inside Xcode locally).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        working-directory: CaraokePOC
        run: swift test

  testflight:
    # Signed TestFlight archive via App Store Connect API-key automatic
    # signing. SKIPPED (job-level `if`) until the repo has these four
    # secrets — the moment the user adds them (post Apple-approval), every
    # push produces a signed .xcarchive without any local Xcode:
    #   ASC_ISSUER_ID / ASC_KEY_ID / ASC_KEY_P8   (App Store Connect →
    #       Users and Access → Integrations → App Store Connect API)
    #   ASC_DEVELOPMENT_TEAM                      (10-char Team ID)
    # Upload to TestFlight is added once the first signed archive proves
    # out (fastlane pilot or altool — decided live).
    if: ${{ vars.HAS_ASC_CREDENTIALS == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare App Store Connect API key
        working-directory: CaraokePOC
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect"
          printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > "$HOME/.appstoreconnect/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: CaraokePOC
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive with automatic signing (cloud signing live-activity profile)
        working-directory: CaraokePOC
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_DEVELOPMENT_TEAM: ${{ secrets.ASC_DEVELOPMENT_TEAM }}
        run: |
          # Automatic (cloud) signing is REQUIRED: the entitlement
          # com.apple.developer.usernotifications.live-activities is an
          # "implied capability" that Xcode adds to generated profiles ONLY
          # when using automatic signing with -allowProvisioningUpdates.
          # Manual/supplied ASC-API profiles never include it (verified
          # 2026-09-02: the REST API capabilityType list has no entry for
          # Live Activities). Without this entitlement push-type Live
          # Activity requests fail on device with ActivityInputError 0,
          # the relay never receives a token, and lyrics freeze on any
          # lock/wake. Cloud signing auto-creates distribution profiles
          # that include the implied entitlement.
          xcodebuild -project Caraoke.xcodeproj -scheme Caraoke \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Caraoke.xcarchive" \
            -authenticationKeyPath "$HOME/.appstoreconnect/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$ASC_DEVELOPMENT_TEAM" \
            archive

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caraoke-xcarchive
          path: CaraokePOC/build/Caraoke.xcarchive

      - name: Export + upload to TestFlight (destination=upload)
        working-directory: CaraokePOC
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          ASC_DEVELOPMENT_TEAM: ${{ secrets.ASC_DEVELOPMENT_TEAM }}
        run: |
          # Automatic export: Xcode re-signs with the same auto-generated
          # profiles (which include the live-activity implied entitlement).
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$ASC_DEVELOPMENT_TEAM</string>
          </dict>
          </plist>
          EOF
          # Debug: show what the archived archive actually carries
          APP_PLIST="$PWD/build/Caraoke.xcarchive/Products/Applications/Caraoke.app/Info.plist"
          plutil -p "$APP_PLIST" | grep -iE 'DeviceFamily|Orientation' || echo "no plist at $APP_PLIST"
          echo "--- entitlements embedded in signed archive:"
          codesign -d --entitlements :- "$PWD/build/Caraoke.xcarchive/Products/Applications/Caraoke.app" 2>/dev/null || echo "codesign read failed"
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Caraoke.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
